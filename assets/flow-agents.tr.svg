<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="İşin nasıl dağıtıldığı. Ana ajan işi sözleşmelere böler. Her sözleşme bir rol adı taşır; rol çarpı profil kademe tablosundan tek bir hücre seçer, hücre bir model ve efora çözülür. Ajanlar paralel çalışır ve her biri diske kendi kaydını bırakır. Yanlarında danışman soranın bir üst basamağında açılır: sonnet sorar opus cevaplar, opus sorar fable cevaplar.">
  <defs>
    <linearGradient id="fatr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="gfatr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="378" rx="18" fill="#0a0a0c" stroke="url(#fatr)" stroke-width="2"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15">
    <rect x="30" y="44" width="200" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
