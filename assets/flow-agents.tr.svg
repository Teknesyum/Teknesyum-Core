    <text x="300" y="284" fill="#b026ff" font-size="14" font-weight="700">Danışman — Soranın Bir Üst Basamağında</text>
    <text x="300" y="312" fill="#9aa3ad" font-size="14">Sonnet Sorar → Opus Cevaplar • Opus Sorar → Fable Cevaplar</text>
    <text x="300" y="334" fill="#5f6b78" font-size="12">Bir Model Kendine İkinci Görüş Veremez</text>
