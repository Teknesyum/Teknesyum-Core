    <text x="712" y="152" fill="#e6e6ea" text-anchor="middle" font-size="15">Ajanlar Paralel Çalışıyor</text>
    <text x="712" y="178" fill="#9aa3ad" text-anchor="middle" font-size="13" font-family="Consolas, 'Cascadia Mono', monospace">Her Biri live/&lt;id&gt;.json Bırakıyor</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif">
