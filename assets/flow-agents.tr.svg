    <path d="M124 126 l6 8 6 -8 z" fill="#3a4550"/>
    <rect x="30" y="140" width="200" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="130" y="169" fill="#e6e6ea" text-anchor="middle">Sözleşme Rolünü Yazıyor</text>
    <path d="M238 163 h30" stroke="#3a4550" stroke-width="2"/>
    <path d="M262 157 l8 6 -8 6 z" fill="#3a4550"/>
    <rect x="276" y="120" width="240" height="86" rx="10" fill="#111116" stroke="#00f3ff"/>
    <text x="396" y="150" fill="#00f3ff" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace">tiers.json</text>
    <text x="396" y="174" fill="#9aa3ad" text-anchor="middle" font-size="14">Rol × Profil → Tek Hücre</text>
    <text x="396" y="194" fill="#5f6b78" text-anchor="middle" font-size="12">Sinyaller Yükseltir, Profil Tavan Koyar</text>
    <path d="M524 163 h30" stroke="#3a4550" stroke-width="2"/>
