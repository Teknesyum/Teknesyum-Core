<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="How work is dispatched. The main agent splits the job into contracts. Each contract names a role, and role times profile picks one cell from the tier table, which resolves to a model and an effort. Agents then run in parallel, each leaving its own record on disk. Beside them the advisor opens one rung above whoever asked: sonnet asks and opus answers, opus asks and fable answers.">
  <defs>
    <linearGradient id="faen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="gfaen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="378" rx="18" fill="#0a0a0c" stroke="url(#faen)" stroke-width="2"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15">
    <rect x="30" y="44" width="200" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="130" y="73" fill="#e6e6ea" text-anchor="middle">t0 Splits The Work</text>
    <path d="M130 98 v34" stroke="#3a4550" stroke-width="2"/>
    <path d="M124 126 l6 8 6 -8 z" fill="#3a4550"/>
    <rect x="30" y="140" width="200" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="130" y="169" fill="#e6e6ea" text-anchor="middle">Contract Names A Role</text>
    <path d="M238 163 h30" stroke="#3a4550" stroke-width="2"/>
    <path d="M262 157 l8 6 -8 6 z" fill="#3a4550"/>
    <rect x="276" y="120" width="240" height="86" rx="10" fill="#111116" stroke="#00f3ff"/>
    <text x="396" y="150" fill="#00f3ff" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace">tiers.json</text>
    <text x="396" y="174" fill="#9aa3ad" text-anchor="middle" font-size="14">Role × Profile → One Cell</text>
    <text x="396" y="194" fill="#5f6b78" text-anchor="middle" font-size="12">Signals Raise It, The Profile Caps It</text>
    <path d="M524 163 h30" stroke="#3a4550" stroke-width="2"/>
    <path d="M548 157 l8 6 -8 6 z" fill="#3a4550"/>
    <rect x="562" y="120" width="300" height="86" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="712" y="152" fill="#e6e6ea" text-anchor="middle" font-size="15">Agents Run In Parallel</text>
    <text x="712" y="178" fill="#9aa3ad" text-anchor="middle" font-size="13" font-family="Consolas, 'Cascadia Mono', monospace">Each Leaves live/&lt;id&gt;.json</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="276" y="256" width="586" height="90" rx="10" fill="none" stroke="#b026ff" stroke-dasharray="5 5"/>
    <text x="300" y="284" fill="#b026ff" font-size="14" font-weight="700">Advisor — One Rung Above Whoever Asked</text>
    <text x="300" y="312" fill="#9aa3ad" font-size="14">Sonnet Asks → Opus Answers • Opus Asks → Fable Answers</text>
    <text x="300" y="334" fill="#5f6b78" font-size="12">A Model Cannot Give Itself A Second Opinion</text>
  </g>
  <path d="M130 190 v110 h140" stroke="#b026ff" stroke-width="2" fill="none"/>
  <path d="M264 294 l8 6 -8 6 z" fill="#b026ff"/>
</svg>
