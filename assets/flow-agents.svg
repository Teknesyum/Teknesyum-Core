<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="How work is dispatched. The main agent splits the job into contracts. Each contract names a role, and the role plus the active profile picks one cell from the tier table, which resolves to a model and an effort. Agents then run in parallel, each leaving a record under live slash. Beside them the advisor opens one rung above whoever asked, so an opus asker is answered by fable and a sonnet asker by opus.">
  <defs>
    <linearGradient id="edge4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="378" rx="18" fill="#0a0a0c" stroke="url(#edge4)" stroke-width="2"/>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="16">
    <rect x="40" y="44" width="180" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="130" y="73" fill="#e6e6ea" text-anchor="middle">t0 splits the work</text>

    <path d="M130 98 v34" stroke="#3a4550" stroke-width="2"/>
    <path d="M124 126 l6 8 6 -8 z" fill="#3a4550"/>

    <rect x="40" y="140" width="180" height="46" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="130" y="169" fill="#e6e6ea" text-anchor="middle">contract names a role</text>

    <path d="M228 163 h40" stroke="#3a4550" stroke-width="2"/>
    <path d="M262 157 l8 6 -8 6 z" fill="#3a4550"/>

    <rect x="276" y="120" width="230" height="86" rx="10" fill="#111116" stroke="#00f3ff"/>
    <text x="391" y="150" fill="#00f3ff" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace">tiers.json</text>
    <text x="391" y="176" fill="#9aa3ad" text-anchor="middle" font-size="14">role &#215; profile &#8594; one cell</text>
    <text x="391" y="196" fill="#5f6b78" text-anchor="middle" font-size="13">signals raise it, the profile caps it</text>

    <path d="M514 163 h40" stroke="#3a4550" stroke-width="2"/>
    <path d="M548 157 l8 6 -8 6 z" fill="#3a4550"/>

    <rect x="562" y="120" width="300" height="86" rx="10" fill="#111116" stroke="#2f3a44"/>
    <text x="712" y="150" fill="#e6e6ea" text-anchor="middle" font-size="15">agents run in parallel</text>
    <text x="712" y="178" fill="#9aa3ad" text-anchor="middle" font-size="14" font-family="Consolas, 'Cascadia Mono', monospace">each leaves live/&lt;id&gt;.json</text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15">
    <rect x="276" y="256" width="586" height="86" rx="10" fill="none" stroke="#b026ff" stroke-dasharray="5 5"/>
    <text x="300" y="284" fill="#b026ff" font-size="14" font-weight="700">advisor &#8212; one rung above whoever asked</text>
    <text x="300" y="312" fill="#9aa3ad" font-size="14">sonnet asks &#8594; opus answers &#8226; opus asks &#8594; fable answers</text>
    <text x="300" y="332" fill="#5f6b78" font-size="13">a model cannot give itself a second opinion</text>
  </g>

  <path d="M130 190 v100 h140" stroke="#b026ff" stroke-width="2" fill="none"/>
  <path d="M264 284 l8 6 -8 6 z" fill="#b026ff"/>
</svg>
